services:
  nginx:
    container_name: nisa-nginx
    build:
      context: ./.docker/nginx
    ports:
      - 8080:80
    volumes:
      - ./public:/var/www/public
      - ./.docker/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app

  app:
    container_name: nisa-app
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    ports:
      - 5174:5173
    volumes:
      - ./:/var/www
    tty: true
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    container_name: nisa-scheduler
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    volumes:
      - ./:/var/www
    command: php artisan schedule:work
    depends_on:
      db:
        condition: service_healthy

  db:
    container_name: nisa-db
    build:
      context: .docker/db
    ports:
      - 3307:3306
    volumes:
      - ./.docker/db/data:/var/lib/mysql
      - ./.docker/db/init:/docker-entrypoint-initdb.d
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?.env に DB_DATABASE を設定してください}
      MYSQL_USER: ${DB_USERNAME:?.env に DB_USERNAME を設定してください}
      MYSQL_PASSWORD: ${DB_PASSWORD:?.env に DB_PASSWORD を設定してください}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?.env に DB_ROOT_PASSWORD を設定してください}
      TZ: Asia/Tokyo
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
